# CI del panel administrativo (Angular, ADR-012), compuerta 1 del Documento de Pruebas:
# lint, pruebas unitarias (Vitest), cobertura ≥ 80% y build.
# Convención de scripts en package.json:
#   lint     → revisión estática (ng lint)
#   test:ci  → pruebas sin modo watch y con navegador headless (el mismo script del hook pre-push)
#   build    → build de producción (ng build)
# Con `artefacto: true`, guarda la carpeta del build como artefacto `panel` para deploy-panel.yml.
# Si el repo todavía no tiene proyecto Angular, avisa y termina en verde.
name: CI Angular

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24.21.0"
      artefacto:
        description: Guardar el build como artefacto para desplegarlo
        type: boolean
        default: false
      cobertura-minima:
        type: string
        default: "80"
    outputs:
      hay-proyecto:
        value: ${{ jobs.ci.outputs.hay }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hay: ${{ steps.proyecto.outputs.hay }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Buscar proyecto Angular
        id: proyecto
        run: |
          if [ -f angular.json ] && [ -f package.json ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay proyecto Angular (angular.json): se omiten lint, pruebas y build."
          fi

      - uses: actions/setup-node@v4
        if: steps.proyecto.outputs.hay == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Instalar dependencias
        if: steps.proyecto.outputs.hay == 'true'
        run: npm ci

      - name: Lint
        if: steps.proyecto.outputs.hay == 'true'
        run: npm run lint

      - name: Pruebas con cobertura
        if: steps.proyecto.outputs.hay == 'true'
        run: |
          set -o pipefail
          npm run test:ci -- --code-coverage | tee salida-pruebas.txt

      - name: Cobertura mínima
        if: steps.proyecto.outputs.hay == 'true'
        uses: ARQUI-202630/quickpatch-infrastructure/.github/actions/cobertura@main
        with:
          formato: texto
          archivos: salida-pruebas.txt
          minimo: ${{ inputs.cobertura-minima }}

      - name: Build de producción
        if: steps.proyecto.outputs.hay == 'true'
        run: npm run build

      # Angular 17+ deja los archivos en dist/<proyecto>/browser; se busca el index.html.
      - name: Ubicar el build
        id: build
        if: steps.proyecto.outputs.hay == 'true' && inputs.artefacto
        run: |
          index=$(find dist -name index.html -not -path '*/server/*' | head -1)
          if [ -z "$index" ]; then echo "::error::No se encontró index.html dentro de dist/."; exit 1; fi
          echo "carpeta=$(dirname "$index")" >> "$GITHUB_OUTPUT"

      - name: Guardar el build
        if: steps.proyecto.outputs.hay == 'true' && inputs.artefacto
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: ${{ steps.build.outputs.carpeta }}
          retention-days: 7
