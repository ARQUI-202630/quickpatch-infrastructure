# Instalación de k3s de un nodo. La usan VM3 (producción) y VM2 (QA).
# Rangos de red fuera de 10.43.0.0/16 (red del laboratorio) y Traefik en la red del host, puertos 30080 y 30443.
- name: Tráfico interno de k3s permitido en ufw (pods y servicios)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    comment: k3s interno
  loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]
  when: ansible_os_family == 'Debian'

- name: Tráfico interno de k3s permitido en firewalld (pods y servicios)
  ansible.posix.firewalld:
    zone: trusted
    source: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]
  when: ansible_os_family == 'RedHat'

- name: Carpeta de manifiestos de k3s
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0700"

# Traefik escucha directamente en el 30080 y el 30443 del host (hostNetwork) y NO como NodePort.
# Un NodePort lo atiende kube-proxy con reglas de NAT que se evalúan antes que las de ufw y firewalld:
# cualquier VM llegaba a ese puerto aunque el firewall solo permitiera a VM1 (se comprobó el 7 de octubre
# de 2026 en VM2 y VM3). Con la red del host, el tráfico pasa por el firewall como el de cualquier otro
# servicio, igual que los contenedores de Docker del proyecto.
# - service ClusterIP: sin NodePort, kube-proxy no abre el 30080 ni el 30443.
# - metrics 9101: el 9100 es de node_exporter en el host y chocaría.
# - maxSurge 0: dos pods de Traefik no pueden compartir los puertos del host durante una actualización.
- name: Configuración de Traefik en la red del host (sin NodePort)
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "0600"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          hostNetwork: true
          service:
            type: ClusterIP
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
              maxSurge: 0
          ports:
            web:
              port: 30080
            websecure:
              port: 30443
            metrics:
              port: 9101

# raw.githubusercontent.com está bloqueado en la red de la universidad, y get.k3s.io
# rechaza clientes que no se identifican como curl. La versión se fija con INSTALL_K3S_VERSION.
- name: Descargar el instalador de k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    http_agent: curl/8.5.0
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Instalar k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --service-cidr={{ k3s_service_cidr }}
      --cluster-cidr={{ k3s_cluster_cidr }}
      --cluster-dns={{ k3s_cluster_dns }}
      --tls-san={{ ansible_host }}
      --disable=servicelb
      --write-kubeconfig-mode=0600

- name: Esperar a que el nodo esté listo
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Namespace {{ k3s_namespace }}
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/k3s kubectl create namespace {{ k3s_namespace }} --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
  args:
    executable: /bin/bash
  register: ns
  changed_when: "'created' in ns.stdout"

- name: Traer el kubeconfig para el runner de VM1
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "../.secretos/kubeconfig-{{ kubeconfig_name }}.yaml"
    flat: true
