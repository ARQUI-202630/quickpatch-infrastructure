# Instalación de k3s de un nodo. La usan VM3 (producción) y VM2 (QA).
# Rangos de red fuera de 10.43.0.0/16 (red del laboratorio) y Traefik en NodePort 30080/30443.
- name: Tráfico interno de k3s permitido en ufw (pods y servicios)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    comment: k3s interno
  loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]
  when: ansible_os_family == 'Debian'

- name: Tráfico interno de k3s permitido en firewalld (pods y servicios)
  ansible.posix.firewalld:
    zone: trusted
    source: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]
  when: ansible_os_family == 'RedHat'

- name: Carpeta de manifiestos de k3s
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0700"

- name: Configuración de Traefik como NodePort
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "0600"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          service:
            type: NodePort
          ports:
            web:
              nodePort: 30080
            websecure:
              nodePort: 30443

# raw.githubusercontent.com está bloqueado en la red de la universidad, y get.k3s.io
# rechaza clientes que no se identifican como curl. La versión se fija con INSTALL_K3S_VERSION.
- name: Descargar el instalador de k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    http_agent: curl/8.5.0
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Instalar k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --service-cidr={{ k3s_service_cidr }}
      --cluster-cidr={{ k3s_cluster_cidr }}
      --cluster-dns={{ k3s_cluster_dns }}
      --tls-san={{ ansible_host }}
      --disable=servicelb
      --write-kubeconfig-mode=0600

- name: Esperar a que el nodo esté listo
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Namespace {{ k3s_namespace }}
  ansible.builtin.shell: /usr/local/bin/k3s kubectl create namespace {{ k3s_namespace }} --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
  register: ns
  changed_when: "'created' in ns.stdout"

- name: Traer el kubeconfig para el runner de VM1
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "../.secretos/kubeconfig-{{ kubeconfig_name }}.yaml"
    flat: true
