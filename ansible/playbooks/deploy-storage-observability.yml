# VM7: Garage (evidencias y respaldos, ADR-016) + Prometheus + Loki + Grafana (secciones 5.2, 7 y 9).
- name: Storage y observabilidad
  hosts: storage_observability
  vars:
    dir: "{{ stack_dir }}/observabilidad"
    garage_compose_dir: "{{ dir }}"
    garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
    garage_admin_token: "{{ vault_garage_admin_token }}"
    garage_capacidad: 30G
    garage_llaves: "{{ vault_garage_keys }}"
    garage_permisos:
      - { bucket: evidencias, llave: servicios }
      - { bucket: backups-postgres, llave: backups }
  tasks:
    - name: Carpetas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dir }}"
        - "{{ dir }}/grafana-provisioning/datasources"
        - "{{ dir }}/grafana-provisioning/dashboards"
        - "{{ dir }}/grafana-provisioning/dashboards-json"
        - "{{ dir }}/grafana-provisioning/alerting"

    - name: Configuración de Prometheus, Loki y Grafana
      ansible.builtin.template:
        src: "../templates/{{ item.src }}"
        dest: "{{ dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: prometheus.yml.j2, dest: prometheus.yml }
        - { src: loki.yml.j2, dest: loki.yml }
        - { src: grafana-datasources.yml.j2, dest: grafana-provisioning/datasources/datasources.yml }
        - { src: grafana-contactpoints.yml.j2, dest: grafana-provisioning/alerting/contactpoints.yml }
        - { src: observabilidad.compose.yml.j2, dest: compose.yml }
      notify: Reiniciar observabilidad

    - name: Dashboards de Grafana (se copian tal cual, sin plantilla)
      ansible.builtin.copy:
        src: "../files/grafana/{{ item.src }}"
        dest: "{{ dir }}/grafana-provisioning/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: dashboards.yml, dest: dashboards/dashboards.yml }
        - { src: quickpatch-logs.json, dest: dashboards-json/quickpatch-logs.json }
        - { src: alerting/rules.yml, dest: alerting/rules.yml }
        - { src: alerting/policies.yml, dest: alerting/policies.yml }
      notify: Reiniciar observabilidad

    - name: Configuración de Garage (lleva secretos)
      ansible.builtin.template:
        src: ../templates/garage.toml.j2
        dest: "{{ dir }}/garage.toml"
        mode: "0600"
      notify: Reiniciar observabilidad

    - name: Levantar Garage, Prometheus, Loki y Grafana
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: present

    - name: Layout, llaves y buckets de Garage
      ansible.builtin.include_tasks: ../tasks/garage.yml

  handlers:
    - name: Reiniciar observabilidad
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: restarted
