# Permite que el k3s de cada ambiente descargue las imágenes privadas de GHCR (ghcr.io/arqui-202630/*).
# La organización no permite paquetes públicos, así que el k3s se identifica con un token de solo lectura
# (vault_ghcr_pull: usuario y token con el permiso read:packages). Corre en VM1, que tiene kubectl y los dos kubeconfig.
#
#   ./ap playbooks/ghcr-pull-secret.yml                      los dos ambientes
#   ./ap playbooks/ghcr-pull-secret.yml -e 'ambientes=["qa"]'
#
# En lugar de tocar el manifiesto de cada servicio, el Secret se le asigna a la cuenta de servicio `default` del namespace
# quickpatch: todo pod que no declare otra recibe el imagePullSecret.
- name: Secret de descarga de imágenes de GHCR en k3s
  hosts: gateway
  gather_facts: false
  become: true
  become_user: "{{ deploy_user }}"
  vars:
    ambientes: [qa, produccion]
    kubeconfig: { qa: config-qa, produccion: config-produccion }
  tasks:
    - name: Secret ghcr-pull
      ansible.builtin.command: "kubectl --kubeconfig /home/{{ deploy_user }}/.kube/{{ kubeconfig[item] }} -n quickpatch apply -f -"
      args:
        stdin: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/ghcr-pull-secret.yaml.j2') }}"
      loop: "{{ ambientes }}"
      register: secreto
      changed_when: "'created' in secreto.stdout or 'configured' in secreto.stdout"
      no_log: true

    - name: Asignarlo a la cuenta de servicio default
      ansible.builtin.command: >-
        kubectl --kubeconfig /home/{{ deploy_user }}/.kube/{{ kubeconfig[item] }} -n quickpatch
        patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
      loop: "{{ ambientes }}"
      register: cuenta
      changed_when: "'patched' in cuenta.stdout and 'no change' not in cuenta.stdout"
