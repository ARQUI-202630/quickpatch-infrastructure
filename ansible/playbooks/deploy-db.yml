# PostgreSQL + PostGIS (secciones 5.2, 5.7 y 9.2) de producción (VM4) y de QA (VM5), con el mismo playbook (ADR-022).
# Lo que cambia entre ambientes está en group_vars/produccion.yml y group_vars/qa.yml.
- name: Base de datos
  hosts: database:qa_datos
  vars:
    dir: "{{ stack_dir }}/postgres"
  tasks:
    - name: Carpetas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop: ["{{ dir }}", "{{ dir }}/backups"]

    # El contenedor lee este script con el usuario postgres (uid 999). Tiene contraseñas: solo él lo lee.
    - name: Carpeta del script de inicialización
      ansible.builtin.file: { path: "{{ dir }}/init", state: directory, owner: "999", mode: "0700" }

    - name: Script de inicialización (bases y PostGIS)
      ansible.builtin.template:
        src: ../templates/postgres-init.sql.j2
        dest: "{{ dir }}/init/01-quickpatch.sql"
        owner: "999"
        mode: "0600"

    - name: Script de roles y dueños de las bases (DD 10.2)
      ansible.builtin.template:
        src: ../templates/postgres-roles.sql.j2
        dest: "{{ dir }}/init/02-roles.sql"
        owner: "999"
        mode: "0600"
      no_log: true

    - name: Acceso solo desde el k3s del ambiente, cada rol a su propia base
      ansible.builtin.template:
        src: ../templates/pg_hba.conf.j2
        dest: "{{ dir }}/pg_hba.conf"
        mode: "0644"
      notify: Reiniciar PostgreSQL

    - name: Compose de PostgreSQL
      ansible.builtin.template:
        src: ../templates/postgres.compose.yml.j2
        dest: "{{ dir }}/compose.yml"
        mode: "0640"
      notify: Reiniciar PostgreSQL

    - name: Levantar PostgreSQL
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: present

    - name: Esperar a que PostgreSQL acepte conexiones
      ansible.builtin.command: docker compose -f {{ dir }}/compose.yml exec -T postgres pg_isready -h 127.0.0.1 -U postgres
      register: pg_listo
      until: pg_listo.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    # En un volumen nuevo el script ya corrió al crearse; en uno existente hay que aplicarlo. Es idempotente, así que
    # se aplica siempre: vuelve a fijar contraseñas y dueños.
    - name: Aplicar los roles y los dueños de las bases
      ansible.builtin.command: >-
        docker compose -f {{ dir }}/compose.yml exec -T -u postgres postgres
        psql -v ON_ERROR_STOP=1 -q -d postgres -f /docker-entrypoint-initdb.d/02-roles.sql
      changed_when: false
      no_log: true

    # El script de inicialización solo corre cuando la base se crea. Para las bases que ya existen, la extensión
    # se habilita aquí (service_request se agregó a postgis_databases después de crear las bases).
    - name: Habilitar PostGIS en las bases que lo necesitan
      ansible.builtin.shell: |
        docker compose -f {{ dir }}/compose.yml exec -T -u postgres postgres \
          psql -d db_{{ item }} -Atc "CREATE EXTENSION IF NOT EXISTS postgis" 2>&1
      register: postgis
      changed_when: "'already exists' not in postgis.stdout"
      loop: "{{ postgis_databases }}"

    # Solo producción: QA no tiene respaldo (sus datos son de prueba).
    - name: Script de respaldo diario a Garage en VM6 (sección 9.2)
      ansible.builtin.template:
        src: ../templates/pg-backup.sh.j2
        dest: /usr/local/bin/quickpatch-pg-backup
        mode: "0750"
      when: pg_respaldo | bool

    - name: Respaldo diario a las 2:00
      ansible.builtin.cron:
        name: quickpatch-pg-backup
        hour: "2"
        minute: "0"
        job: /usr/local/bin/quickpatch-pg-backup >> /var/log/quickpatch-pg-backup.log 2>&1
      when: pg_respaldo | bool

  handlers:
    - name: Reiniciar PostgreSQL
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: restarted
