# Limpieza por fases de la migración al reparto del ADR-022 (3 VMs de producción, 3 de QA y 1 de herramientas).
# DESTRUCTIVA: borra volúmenes, archivos y reglas de firewall del reparto anterior. Todo estaba vacío (sin servicios ni
# datos). Cada fase exige -e confirmar_borrado=true y se corre solo después de comprobar la fase anterior.
# setup-base.yml solo agrega reglas de firewall: lo que sobra de antes se quita aquí.
#
# Paso 1 (observabilidad en VM1):
#   --tags obs-vm7   quita Prometheus, Loki y Grafana viejos de VM7 y sus reglas (3100, 3000 y 9090).
#                    Correr después de deploy-garage.yml, que saca esos contenedores de VM7.
#   --tags fw-9100   quita en las 7 VMs la regla vieja que dejaba a VM7 leer node_exporter (ahora lee VM1).
- name: Quitar la observabilidad vieja de VM7
  hosts: storage_observability
  tags: [obs-vm7]
  vars:
    dir: "{{ stack_dir }}/observabilidad"
  tasks:
    - name: Exigir confirmación
      ansible.builtin.assert:
        that: confirmar_borrado | default(false) | bool
        fail_msg: "Operación destructiva: repetir con -e confirmar_borrado=true"
    - name: Borrar los volúmenes de Prometheus, Loki y Grafana de VM7
      ansible.builtin.command: docker volume rm --force observabilidad_{{ item }}
      loop: [prometheus-data, loki-data, grafana-data]
      changed_when: true
    - name: Borrar la configuración vieja de Prometheus, Loki y Grafana de VM7
      ansible.builtin.file:
        path: "{{ dir }}/{{ item }}"
        state: absent
      loop: [prometheus.yml, loki.yml, grafana-provisioning]
    - name: Quitar de VM7 la regla de Loki (3100) para las 7 VMs
      community.general.ufw:
        rule: allow
        port: "3100"
        proto: tcp
        from_ip: "{{ item }}"
        delete: true
      loop: "{{ all_vms }}"
    - name: Quitar de VM7 las reglas de Grafana (3000) y Prometheus (9090) del equipo
      community.general.ufw:
        rule: allow
        port: "{{ item.0 }}"
        proto: tcp
        from_ip: "{{ item.1 }}"
        delete: true
      loop: "{{ ['3000', '9090'] | product(team_networks) | list }}"

- name: Quitar la regla vieja de node_exporter en las 7 VMs
  hosts: all
  tags: [fw-9100]
  tasks:
    - name: Exigir confirmación
      ansible.builtin.assert:
        that: confirmar_borrado | default(false) | bool
        fail_msg: "Operación destructiva: repetir con -e confirmar_borrado=true"
    - name: Quitar 9100 desde VM7 (ufw)
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        from_ip: "{{ ip.vm7 }}"
        delete: true
      when: ansible_os_family == 'Debian'
    - name: Quitar 9100 desde VM7 (firewalld)
      ansible.posix.firewalld:
        zone: quickpatch
        rich_rule: 'rule family="ipv4" source address="{{ ip.vm7 }}" port port="9100" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: disabled
      when: ansible_os_family == 'RedHat'
