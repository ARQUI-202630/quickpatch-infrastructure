# Garage (S3: evidencias y respaldos de PostgreSQL, ADR-016) de producción en VM6, con Kafka (ADR-022).
# Una llave por uso, con permiso solo sobre sus buckets: `service-request` para las evidencias y `backups` para
# el respaldo diario de PostgreSQL. Reemplazan a la llave compartida `servicios`.
- name: Garage de producción (VM6)
  hosts: storage
  vars:
    dir: "{{ stack_dir }}/garage"
    garage_compose_dir: "{{ dir }}"
    garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
    garage_admin_token: "{{ vault_garage_admin_token }}"
    garage_capacidad: 30G
    garage_llaves:
      service-request: "{{ vault_garage_keys.service_request }}"
      backups: "{{ vault_garage_keys.backups }}"
    garage_permisos:
      - { bucket: service-request-evidencias, llave: service-request }
      - { bucket: backups-postgres, llave: backups }
  tasks:
    - name: Carpeta
      ansible.builtin.file: { path: "{{ dir }}", state: directory, mode: "0755" }

    - name: Configuración de Garage (lleva secretos)
      ansible.builtin.template:
        src: "../templates/{{ item.src }}"
        dest: "{{ dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - { src: garage.toml.j2, dest: garage.toml }
        - { src: garage.compose.yml.j2, dest: compose.yml }
      notify: Reiniciar Garage

    - name: Levantar Garage
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: present

    - name: Layout, llaves y buckets de Garage
      ansible.builtin.include_tasks: ../tasks/garage.yml

  handlers:
    - name: Reiniciar Garage
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: restarted
