# Garage (S3: evidencias y respaldos de PostgreSQL, ADR-016) de producción (VM6) y de QA (VM7), con el mismo
# playbook (ADR-022). La capacidad, los secretos, las llaves y los permisos de cada ambiente están en group_vars.
# Una llave por uso, con permiso solo sobre sus buckets: `service-request` para las evidencias y `backups` para
# el respaldo diario de PostgreSQL. Reemplazan a la llave compartida `servicios`.
- name: Garage
  hosts: storage:qa_mensajeria
  vars:
    dir: "{{ stack_dir }}/garage"
    garage_compose_dir: "{{ dir }}"
  tasks:
    - name: Carpeta
      ansible.builtin.file: { path: "{{ dir }}", state: directory, mode: "0755" }

    - name: Configuración de Garage (lleva secretos)
      ansible.builtin.template:
        src: "../templates/{{ item.src }}"
        dest: "{{ dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - { src: garage.toml.j2, dest: garage.toml }
        - { src: garage.compose.yml.j2, dest: compose.yml }
      notify: Reiniciar Garage

    - name: Levantar Garage
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: present

    - name: Layout, llaves y buckets de Garage
      ansible.builtin.include_tasks: ../tasks/garage.yml

  handlers:
    - name: Reiniciar Garage
      community.docker.docker_compose_v2:
        project_src: "{{ dir }}"
        state: restarted
