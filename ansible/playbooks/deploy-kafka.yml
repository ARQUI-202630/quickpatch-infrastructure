# Apache Kafka en modo KRaft (sin ZooKeeper) + Kafka UI de producción (VM6) y de QA (VM7), con el mismo playbook
# (ADR-022, sección 5.2).
# Kafka UI escucha en la IP de la VM pero el firewall no abre el 8080: se entra por túnel SSH
# (ssh -L 8080:<IP de VM6>:8080 estudiante@<IP de VM6>).
- name: Mensajería
  hosts: messaging:qa_mensajeria
  vars:
    dir: "{{ stack_dir }}/kafka"
  tasks:
    - name: Carpeta
      ansible.builtin.file: { path: "{{ dir }}", state: directory, mode: "0750" }
    - name: Compose de Kafka
      ansible.builtin.copy:
        dest: "{{ dir }}/compose.yml"
        mode: "0640"
        content: |
          services:
            kafka:
              image: {{ images.kafka }}
              network_mode: host
              restart: unless-stopped
              environment:
                KAFKA_NODE_ID: 1
                KAFKA_PROCESS_ROLES: broker,controller
                KAFKA_LISTENERS: PLAINTEXT://{{ ansible_host }}:9092,CONTROLLER://127.0.0.1:9093
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://{{ ansible_host }}:9092
                KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
                KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
                KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
                KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
                KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
                KAFKA_LOG_RETENTION_HOURS: {{ kafka_retencion_horas }}
                KAFKA_HEAP_OPTS: "{{ kafka_heap }}"
              volumes:
                - kafka-data:/var/lib/kafka/data
            kafka-ui:
              image: {{ images.kafka_ui }}
              network_mode: host
              restart: unless-stopped
              environment:
                SERVER_PORT: 8080
                KAFKA_CLUSTERS_0_NAME: quickpatch
                KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: {{ ansible_host }}:9092
              depends_on: [kafka]
          volumes:
            kafka-data:
    - name: Levantar Kafka y Kafka UI
      community.docker.docker_compose_v2: { project_src: "{{ dir }}", state: present }
