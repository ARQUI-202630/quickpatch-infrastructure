# Inventario de QUICKPATCH (Documento de Infraestructura, sección 5.1).
# Producción: VM1, VM3 a VM7. QA: VM2 (ADR-015). El panel Angular vive en VM1.
# El usuario SSH de las VMs va en group_vars/all/main.yml (vm_admin_user).
all:
  children:
    gateway:
      hosts:
        vm1: { ansible_host: 10.43.100.168 }
    observabilidad:    # herramientas (ADR-022): Prometheus, Loki y Grafana de los dos ambientes
      hosts:
        vm1: { ansible_host: 10.43.100.168 }
    qa:                # ambiente de QA: el sistema completo en una VM (ADR-015)
      hosts:
        vm2: { ansible_host: 10.43.98.15 }
    backend:
      hosts:
        vm3: { ansible_host: 10.43.98.205 }
    database:
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    cache:
      hosts:
        vm5: { ansible_host: 10.43.98.29 }
    messaging:         # producción, mensajería (ADR-022): Kafka y Kafka UI
      hosts:
        vm6: { ansible_host: 10.43.99.12 }
    storage:           # producción, almacenamiento (ADR-022): Garage de evidencias y respaldos
      hosts:
        vm6: { ansible_host: 10.43.99.12 }
    qa_mensajeria:     # QA, mensajería y almacenamiento (ADR-022): Kafka y Garage de QA (paso 5)
      hosts:
        vm7: { ansible_host: 10.43.99.8 }
