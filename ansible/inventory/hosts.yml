# Inventario de QUICKPATCH (ADR-022: 1 VM de herramientas, 3 de producción y 3 de QA).
# Herramientas: VM1 (proxy Nginx por nombre, runner, k6, Prometheus, Loki y Grafana de los dos ambientes).
# Producción: VM3 (aplicación, k3s), VM4 (datos: PostgreSQL y Redis) y VM6 (mensajería y almacenamiento: Kafka y Garage).
# QA: VM2 (aplicación), VM5 (datos) y VM7 (mensajería y almacenamiento), con los mismos componentes que producción.
# Los playbooks son los mismos para los dos ambientes: eligen su grupo de producción y su grupo de QA, y las
# diferencias (secretos, memoria, retención) están en group_vars/produccion.yml y group_vars/qa.yml.
# El usuario SSH de las VMs va en group_vars/all/main.yml (vm_admin_user).
all:
  children:
    gateway:           # herramientas: proxy Nginx :443 por nombre y runner
      hosts:
        vm1: { ansible_host: 10.43.100.168 }
    observabilidad:    # herramientas: Prometheus, Loki y Grafana de los dos ambientes
      hosts:
        vm1: { ansible_host: 10.43.100.168 }
    backend:           # producción, aplicación: k3s con los servicios
      hosts:
        vm3: { ansible_host: 10.43.98.205 }
    database:          # producción, datos: PostgreSQL
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    cache:             # producción, datos: Redis (junto a PostgreSQL)
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    messaging:         # producción, mensajería: Kafka y Kafka UI
      hosts:
        vm6: { ansible_host: 10.43.99.12 }
    storage:           # producción, almacenamiento: Garage de evidencias y respaldos
      hosts:
        vm6: { ansible_host: 10.43.99.12 }
    produccion:        # ambiente de producción: VM3, VM4 y VM6
      children:
        backend:
        database:
        cache:
        messaging:
        storage:
    qa_app:            # QA, aplicación: k3s con los servicios
      hosts:
        vm2: { ansible_host: 10.43.98.15 }
    qa_datos:          # QA, datos: PostgreSQL y Redis
      hosts:
        vm5: { ansible_host: 10.43.98.29 }
    qa_mensajeria:     # QA, mensajería y almacenamiento: Kafka y Garage
      hosts:
        vm7: { ansible_host: 10.43.99.8 }
    qa:                # ambiente de QA: VM2, VM5 y VM7
      children:
        qa_app:
        qa_datos:
        qa_mensajeria:
