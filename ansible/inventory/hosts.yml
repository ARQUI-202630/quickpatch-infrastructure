# Inventario de QUICKPATCH (ADR-021: reparto de las 7 VMs por ambiente).
# Producción: VM1 (entrada), VM3 (servicios, k3s) y VM4 (datos: PostgreSQL, Redis y Kafka).
# QA: VM2 (entrada), VM5 (servicios, k3s) y VM6 (datos), con la misma forma que producción.
# Herramientas: VM7 (Garage de producción, Prometheus, Loki y Grafana).
# Los grupos database, cache y messaging apuntan a la misma VM4: cada playbook (deploy-db, deploy-cache y
# deploy-kafka) sigue su propio grupo, así que no cambian de nombre aunque compartan máquina.
# El usuario SSH de las VMs va en group_vars/all/main.yml (vm_admin_user).
all:
  children:
    gateway:           # producción: entrada (Nginx, panel Angular y runner)
      hosts:
        vm1: { ansible_host: 10.43.100.168 }
    backend:           # producción: servicios (k3s con los 8 microservicios)
      hosts:
        vm3: { ansible_host: 10.43.98.205 }
    database:          # producción: datos (PostgreSQL, Redis y Kafka en la misma VM)
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    cache:
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    messaging:
      hosts:
        vm4: { ansible_host: 10.43.98.209 }
    qa_entrada:        # QA: Nginx y panel Angular de QA
      hosts:
        vm2: { ansible_host: 10.43.98.15 }
    qa_servicios:      # QA: k3s con los 8 microservicios
      hosts:
        vm5: { ansible_host: 10.43.98.29 }
    qa_datos:          # QA: PostgreSQL, Redis, Kafka y Garage
      hosts:
        vm6: { ansible_host: 10.43.99.12 }
    qa:                # ambiente de QA completo (ADR-021)
      children:
        qa_entrada:
        qa_servicios:
        qa_datos:
    storage_observability:   # herramientas: Garage de producción, Prometheus, Loki y Grafana
      hosts:
        vm7: { ansible_host: 10.43.99.8 }
