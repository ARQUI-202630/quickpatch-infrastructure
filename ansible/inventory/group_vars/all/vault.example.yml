# Plantilla de secretos (sección 8). NO guardar valores reales aquí.
# Copiar a vault.yml, llenar y cifrar:
#   cp vault.example.yml vault.yml
#   ansible-vault encrypt vault.yml
vault_postgres_superuser_password: CAMBIAR
vault_service_db_passwords:          # una por base de postgres_databases
  identity: CAMBIAR
  actors: CAMBIAR
  catalog: CAMBIAR
  service_request: CAMBIAR
  matching: CAMBIAR
  ranking: CAMBIAR
  payments: CAMBIAR
  communication: CAMBIAR
vault_redis_password: CAMBIAR   # en desuso desde el ADR-022 (usuarios ACL por servicio); se conserva hasta migrar QA
vault_redis_admin_password: CAMBIAR   # usuario admin de Redis, solo para operación (no se entrega a ningún servicio)
vault_redis_users:                    # un usuario de Redis por servicio, restringido a sus claves <servicio>:*
  identity: CAMBIAR
  actors: CAMBIAR
  catalog: CAMBIAR
  service_request: CAMBIAR
  matching: CAMBIAR
  ranking: CAMBIAR
  payments: CAMBIAR
  communication: CAMBIAR
# Garage (ADR-016). rpc_secret: 64 hex. Llaves: id = "GK" + 24 hex; secret = 64 hex.
vault_garage_rpc_secret: CAMBIAR
vault_garage_admin_token: CAMBIAR
vault_garage_keys:
  servicios: { id: CAMBIAR, secret: CAMBIAR }   # evidencias (los servicios de VM3)
  backups: { id: CAMBIAR, secret: CAMBIAR }     # respaldos de PostgreSQL (VM4)
vault_grafana_admin_password: CAMBIAR
vault_smtp_password: CAMBIAR   # contraseña de aplicación de Gmail para las alertas de Grafana (opcional: sin ella no hay correo)
vault_github_runner_token: CAMBIAR   # token de registro del runner, a nivel de organización

# QA (ADR-015): secretos propios, nunca los de producción
vault_qa_postgres_superuser_password: CAMBIAR
vault_qa_service_db_password: CAMBIAR   # una sola para las bases de QA
vault_qa_redis_password: CAMBIAR
vault_qa_redis_admin_password: CAMBIAR
vault_qa_redis_users:                 # igual que vault_redis_users, con valores distintos a los de producción
  identity: CAMBIAR
  actors: CAMBIAR
  catalog: CAMBIAR
  service_request: CAMBIAR
  matching: CAMBIAR
  ranking: CAMBIAR
  payments: CAMBIAR
  communication: CAMBIAR
vault_qa_garage_rpc_secret: CAMBIAR
vault_qa_garage_admin_token: CAMBIAR
vault_qa_garage_keys:
  servicios: { id: CAMBIAR, secret: CAMBIAR }

# Servicios en k3s (primer-despliegue-servicios.yml): llave RSA con la que Identity firma los tokens (ADR-018) y su
# pública, que reciben los demás servicios. Una por ambiente: openssl genrsa -out k.pem 2048; openssl rsa -in k.pem -pubout
vault_jwt_keys:
  qa:
    private: |
      CAMBIAR (PEM)
    public: |
      CAMBIAR (PEM)
  produccion:
    private: |
      CAMBIAR (PEM)
    public: |
      CAMBIAR (PEM)
# Administradores iniciales que Identity crea al arrancar: el del tenant (admin_tenant) y el de la plataforma (admin_plataforma)
vault_identity_admins:
  qa: { admin_email: CAMBIAR, admin_password: CAMBIAR, platform_email: CAMBIAR, platform_password: CAMBIAR }
  produccion: { admin_email: CAMBIAR, admin_password: CAMBIAR, platform_email: CAMBIAR, platform_password: CAMBIAR }
