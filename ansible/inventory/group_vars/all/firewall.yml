# Reglas de firewall (Documento de Infraestructura, sección 10.2).
# Política: denegar todo lo entrante; solo se abren estos pares origen-puerto.
# Los contenedores usan red de host para que ufw sí controle su tráfico
# (con puertos publicados, Docker se salta las reglas de ufw).
all_vms: "{{ ip.values() | list }}"

firewall_common:
  - { port: 9100, from: ["{{ ip.vm7 }}"], comment: "Prometheus -> node_exporter" }
  - { port: 3389, from: "{{ team_networks }}", comment: "Escritorio remoto (xrdp) del equipo" }
  - { port: 10050, from: "{{ lab_networks }}", comment: "Agente Zabbix del laboratorio" }

firewall_by_host:
  vm1:
    - { port: 443, from: [any], comment: "HTTPS publico (unico punto de entrada)" }
  vm2:   # QA, entrada (ADR-021). Producción no acepta conexiones desde QA.
    - { port: 443, from: "{{ team_networks + [ip.vm1] }}", comment: "Equipo y k6 (runner de VM1) -> QA" }
  vm3:
    - { port: 30080, from: ["{{ ip.vm1 }}"], comment: "Gateway -> Traefik (HTTP)" }
    - { port: 30443, from: ["{{ ip.vm1 }}"], comment: "Gateway -> Traefik (HTTPS)" }
    - { port: 6443, from: ["{{ ip.vm1 }}"], comment: "Runner -> API de k3s" }
  vm4:   # Producción, datos (ADR-021): PostgreSQL, Redis y Kafka. Kafka UI (8080) no se abre: se entra por túnel SSH.
    - { port: 5432, from: ["{{ ip.vm3 }}"], comment: "Microservicios -> PostgreSQL" }
    - { port: 6379, from: ["{{ ip.vm3 }}"], comment: "Microservicios -> Redis" }
    - { port: 9092, from: ["{{ ip.vm3 }}"], comment: "Microservicios -> Kafka" }
  vm5:   # QA, servicios (ADR-021): k3s de QA
    - { port: 30080, from: ["{{ ip.vm2 }}"], comment: "Nginx de QA -> Traefik (HTTP)" }
    - { port: 6443, from: ["{{ ip.vm1 }}"], comment: "Runner -> API de k3s de QA" }
  vm6:   # QA, datos (ADR-021): solo el k3s de QA (VM5) puede entrar
    - { port: 5432, from: ["{{ ip.vm5 }}"], comment: "k3s de QA -> PostgreSQL" }
    - { port: 6379, from: ["{{ ip.vm5 }}"], comment: "k3s de QA -> Redis" }
    - { port: 9092, from: ["{{ ip.vm5 }}"], comment: "k3s de QA -> Kafka" }
    - { port: 9000, from: ["{{ ip.vm5 }}"], comment: "k3s de QA -> Garage (S3)" }
  vm7:
    - { port: 9000, from: ["{{ ip.vm3 }}", "{{ ip.vm4 }}"], comment: "Evidencias y backup -> Garage (S3)" }
    - { port: 3100, from: "{{ all_vms }}", comment: "Promtail -> Loki" }
    - { port: 3000, from: "{{ team_networks }}", comment: "Equipo -> Grafana" }
    - { port: 9090, from: "{{ team_networks }}", comment: "Equipo -> Prometheus" }
