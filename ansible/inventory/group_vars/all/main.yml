# Variables comunes a las 7 VMs.

# --- Acceso -----------------------------------------------------------------
vm_admin_user: estudiante         # usuario que dio el laboratorio. La clave NUNCA va en este repo (-k -K)
ansible_user: "{{ vm_admin_user }}"
deploy_user: quickpatch            # usuario de despliegue que crea setup-base.yml
deploy_user_pubkeys: []            # llaves públicas (*.pub); vacío: el equipo decidió SSH con contraseña

# Desactivar el login por contraseña solo si se decide usar llaves y después de probarlas
# (Documento de Infraestructura, sección 10.4).
ssh_disable_password_auth: false

# Desde dónde se permite SSH y el acceso del equipo a las consolas (Kafka UI, Grafana,
# Prometheus, escritorio remoto). La VPN de la Javeriana entrega direcciones 10.101.x.x
# (observado el 2026-10-03), dentro de 10.0.0.0/8.
ssh_allowed_from: [any]
team_networks: [10.0.0.0/8]
# Monitoreo del laboratorio: el agente de Zabbix (10050) ya escucha en las 7 VMs.
lab_networks: [10.0.0.0/8]

# --- IPs (Documento de Infraestructura, sección 3.2) -------------------------
ip:
  vm1: 10.43.100.168
  vm2: 10.43.98.15
  vm3: 10.43.98.205
  vm4: 10.43.98.209
  vm5: 10.43.98.29
  vm6: 10.43.99.12
  vm7: 10.43.99.8

# --- Alertas de Grafana por correo ----------------------------------------------
# Remitente: cuenta de Gmail con contraseña de aplicación (vault_smtp_password). Sin esa clave,
# Grafana arranca con el correo desactivado y las reglas solo se ven en el panel.
alertas_correo: sanchezse@javeriana.edu.co
smtp_servidor: smtp.gmail.com:587
smtp_usuario: sebastiansanchez3004@gmail.com

# --- Rutas --------------------------------------------------------------------
stack_dir: /opt/quickpatch

# --- Gateway (VM1) ------------------------------------------------------------
# VM1:443 es el único puerto que el firewall perimetral de la universidad deja pasar
# desde la VPN (observado el 2026-10-03: VM7:3000, VM7:9090 y VM2:443 no pasan).
# Nginx elige el destino por el nombre pedido (ADR-015). No hay DNS: cada persona
# agrega a su archivo hosts una línea con los tres nombres apuntando a VM1.
gateway_domain: quickpatch.internal
gateway_hosts:
  produccion: "{{ gateway_domain }}"
  qa: "qa.{{ gateway_domain }}"
  grafana: "grafana.{{ gateway_domain }}"

# --- Versiones fijadas ---------------------------------------------------------
images:
  postgis: postgis/postgis:16-3.4
  redis: redis:7.4-alpine
  kafka: apache/kafka:3.8.1
  kafka_ui: provectuslabs/kafka-ui:v0.7.2
  garage: dxflrs/garage:v2.4.1
  aws_cli: amazon/aws-cli:2.37.9
  prometheus: prom/prometheus:v2.55.1
  loki: grafana/loki:3.3.2
  grafana: grafana/grafana:11.4.0
  node_exporter: prom/node-exporter:v1.8.2
  promtail: grafana/promtail:3.3.2
  nginx: nginx:1.27-alpine
k3s_version: v1.31.4+k3s1

# Almacenamiento de objetos (evidencias y respaldos): Garage, compatible con S3 (ADR-016).
# Reemplaza a MinIO, que dejó de distribuir imágenes y binarios en 2025. API S3 en el puerto
# 9000 de VM7 (producción) y de VM2 (QA); RPC y administración solo en localhost.
garage_region: garage

# --- k3s (sección 5.2: fuera del rango del laboratorio, 10.43.0.0/16) ---------
k3s_service_cidr: 10.44.0.0/16
k3s_cluster_cidr: 10.42.0.0/16
k3s_cluster_dns: 10.44.0.10

# --- PostgreSQL ----------------------------------------------------------------
# Una base por servicio, según la propuesta de base de datos por servicio
# (pendiente de aprobación del equipo como ADR-014). Si no se aprueba, dejar una sola.
postgres_databases:
  - identity
  - actors
  - catalog
  - service_request
  - matching
  - ranking
  - payments
  - communication
postgis_databases: [matching, service_request]   # service_request guarda la ubicación de la solicitud: geometry(Point, 4326)

# --- QA (ADR-015) --------------------------------------------------------------
# Mismos componentes que producción, con memoria reducida para caber en una VM.
qa_kafka_heap: "-Xms512m -Xmx1g"
qa_redis_maxmemory: 512mb

# Redis de producción (ADR-022): comparte VM4 con PostgreSQL. El tope se revisa con la medición de RAM (SCRUM-347).
redis_maxmemory: 1gb
backup_retention_days: 7
